name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Go 1.21
            os: ubuntu-24.04
            go-version: 1.21.x
          - name: Linux stable Go
            os: ubuntu-24.04
            go-version: stable
          - name: macOS stable Go
            os: macos-15
            go-version: stable
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build
        run: make build

  browser-e2e:
    name: Chromium E2E
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.21.x
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Install browser dependencies
        run: pnpm install --frozen-lockfile

      - name: Check browser JavaScript syntax
        run: |
          node --check internal/webapi/web/app.js
          node --check tests/e2e/demo.spec.js

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser E2E
        run: pnpm e2e

      - name: Upload browser failure report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            .build/playwright-results
          if-no-files-found: ignore
          retention-days: 7

  container:
    name: Container smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and start Compose demo
        env:
          STEAM_PROFIT_PORT: 18081
          STEAM_PROFIT_DEMO_USERNAME: ci-reviewer
          STEAM_PROFIT_DEMO_PASSWORD: ci-demo-password
          STEAM_PROFIT_RATE_LIMIT_PER_MINUTE: 6
          STEAM_PROFIT_AI_RUNS_PER_HOUR: 3
        run: docker compose up --build --wait

      - name: Verify protected access, limits, and persistence
        env:
          STEAM_PROFIT_PORT: 18081
          STEAM_PROFIT_DEMO_USERNAME: ci-reviewer
          STEAM_PROFIT_DEMO_PASSWORD: ci-demo-password
          STEAM_PROFIT_RATE_LIMIT_PER_MINUTE: 6
          STEAM_PROFIT_AI_RUNS_PER_HOUR: 3
        run: |
          curl --fail --silent --show-error http://127.0.0.1:18081/api/health
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18081/)" = "401"
          curl --fail --silent --show-error --user 'ci-reviewer:ci-demo-password' http://127.0.0.1:18081/api/v1/metrics
          curl --fail --silent --show-error \
            --user 'ci-reviewer:ci-demo-password' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"item_name":"CI Container","buy_price":0.48,"quantity":1,"multiplier":0.837,"sell_prices":[0.8]}' \
            http://127.0.0.1:18081/api/v1/calculations
          docker compose up --force-recreate --wait
          curl --fail --silent --show-error \
            --user 'ci-reviewer:ci-demo-password' \
            'http://127.0.0.1:18081/api/v1/records?item=CI%20Container' \
            | grep --quiet '"total":1'
          curl --fail --silent --show-error \
            --user 'ci-reviewer:ci-demo-password' \
            'http://127.0.0.1:18081/api/v1/records?item=Demo%20Capsule' \
            | grep --quiet '"total":12'
          for request_number in 1 2 3 4; do
            curl --fail --silent --show-error \
              --user 'ci-reviewer:ci-demo-password' \
              http://127.0.0.1:18081/api/v1/assistant/status >/dev/null
          done
          test "$(curl --silent --show-error --user 'ci-reviewer:ci-demo-password' --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18081/api/v1/metrics)" = "429"

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop Compose demo
        if: always()
        run: docker compose down --volumes

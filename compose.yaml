name: steam-profit-demo

services:
  app:
    build:
      context: .
    image: steam-profit-calculator:demo
    init: true
    restart: unless-stopped
    stop_grace_period: 10s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${STEAM_PROFIT_PORT:-8080}:8080"
    environment:
      STEAM_PROFIT_SERVER_ADDR: 0.0.0.0:8080
      STEAM_PROFIT_STORAGE: sqlite
      STEAM_PROFIT_DATABASE_FILE: /data/steam-profit.db
      STEAM_PROFIT_IMPORT_CSV: /app/demo/seed.csv
      STEAM_PROFIT_AI_PROVIDER: disabled
      STEAM_PROFIT_DEMO_USERNAME: ${STEAM_PROFIT_DEMO_USERNAME:-}
      STEAM_PROFIT_DEMO_PASSWORD: ${STEAM_PROFIT_DEMO_PASSWORD:-}
      STEAM_PROFIT_RATE_LIMIT_PER_MINUTE: ${STEAM_PROFIT_RATE_LIMIT_PER_MINUTE:-0}
      STEAM_PROFIT_AI_RUNS_PER_HOUR: ${STEAM_PROFIT_AI_RUNS_PER_HOUR:-0}
      STEAM_PROFIT_TRUST_PROXY_HEADERS: ${STEAM_PROFIT_TRUST_PROXY_HEADERS:-false}
    volumes:
      - steam-profit-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  steam-profit-data:
    name: ${STEAM_PROFIT_DATA_VOLUME:-steam-profit-demo-data}
